[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microloan-readiness-checker"
version = "0.1.0"
description = "Rule-only baseline for the PE6201 microloan application readiness project"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["google-genai>=2.25,<3"]

[project.scripts]
microloan-rule-check = "microloan_checker.cli:main"
microloan-hybrid-check = "microloan_checker.hybrid_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
